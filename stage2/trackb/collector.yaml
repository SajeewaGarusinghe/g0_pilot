# The OpenTelemetry collector for the Track B spike: a *current* release (pinned below),
# receiving OTLP/gRPC from the application and writing OTLP/JSON with the file exporter -
# one ExportTraceServiceRequest per line, which is exactly what `rcaeval-convert traces` reads.
#
# This is the configuration K18 is about: the question is whether a gRPC status code survives
# the trip from the application's SDK, through this collector, into traces.csv.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
    exporters:
      file:
        path: /data/otlp-traces.jsonl
      debug:
        verbosity: basic
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [file, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        # the collector image is distroless: it has no shell and no tar, so neither
        # `kubectl exec ... sh` nor `kubectl cp` can reach the file the exporter writes.
        # this sidecar shares the volume and exists only so the capture can read it out.
        - name: filereader
          image: busybox:1.37
          command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
            items: [{key: config.yaml, path: config.yaml}]
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
